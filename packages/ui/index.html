<!doctype html>
<html lang="de" data-theme="light">
  <head>
    <base href="%BASE_URL%">
    <meta charset="utf-8">
    <meta
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
      name="viewport"
    >
    <meta content="text/html; charset=utf-8" http-equiv="content-type">
    <meta content="IE=Edge" http-equiv="x-ua-compatible">

    <title>Kulturverein Lochmühle e.V.</title>
    <link rel="stylesheet" href="./src/globals.scss">
    <link rel="stylesheet" href="./src/fonts.scss">
    <style>
      :root {
        --wcp-title-spacing: 0 10px;
      }

      body {
        margin: 0;
        color: var(--kvlm-color-grey-light);
        font-family: var(--kvlm-font-family-body);
      }

      wcp-root {
        --wcp-layout-flowing-width: 1200px;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "element-internals-polyfill": "./libs/element-internals-polyfill/dist/index.js",
          "urlpattern-polyfill": "./libs/urlpattern-polyfill/index.js",
          "@lit/reactive-element": "./libs/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "./libs/@lit/reactive-element/",
          "lit": "./libs/lit/index.js",
          "lit/": "./libs/lit/",
          "lit-element/": "./libs/lit-element/",
          "lit-html": "./libs/lit-html/lit-html.js",
          "lit-html/": "./libs/lit-html/",
          "lodash-es/": "./libs/lodash-es/"
        }
      }
    </script>

    <script type="module">
      import '@webcomponents-preview/client';
      import.meta.glob('./src/components/**/*.component.ts', { eager: true });
    </script>
  </head>

  <body ontouchstart>
    <wcp-root
      config-url="%BASE_URL%preview.config.json"
      manifest-url="%BASE_URL%custom-elements.json"
      reload-query-param="wcp-hot-reload"
    >
      <kvlm-logo slot="logo" style="width: 100%; ---kvlm-logo-brook-color: #6fbad9"></kvlm-logo>
    </wcp-root>
  </body>
</html>
