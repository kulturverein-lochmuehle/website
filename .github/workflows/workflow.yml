name: Workflow
on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ESLINT_JUNIT_OUTPUT_FILE: reports/lint.junit.xml
      JEST_JUNIT_OUTPUT_FILE: reports/test.junit.xml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Determine Playwright version
        # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/workflow-commands-for-github-actions?tool=bash#setting-an-output-parameter
        id: playwright
        run: echo "version=$(pnpm why playwright --json --filter @kvlm/ui | jq -r '.[0].devDependencies."@web/test-runner-playwright".dependencies.playwright.version')" >> "$GITHUB_OUTPUT"
      - name: Install Playwright browsers
        env:
          PW_VERSION: ${{ steps.playwright.outputs.version }}
        run: pnpm dlx playwright@$PW_VERSION install chromium --only-shell

      - name: Lint
        run: pnpm -r --parallel lint --format junit --output-file ${ESLINT_JUNIT_OUTPUT_FILE}
      - name: Test
        run: pnpm -r test --ci --reporters=default --reporters=jest-junit
      - name: Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: success() || failure()
        with:
          check_name: Report
          include_passed: true
          report_paths: reports/*.junit.xml
