name: Workflow
on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ESLINT_JUNIT_OUTPUT_FILE: reports/lint.junit.xml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Setup Node
        # the test runner and Astro still run on node, bun only installs and orchestrates
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Determine Playwright version
        id: playwright
        # bun's isolated linker keeps playwright out of the root node_modules
        run: echo "version=$(bun pm ls --all | awk '{print $NF}' | grep -E '^playwright@' | head -1 | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - name: Install Playwright browsers
        env:
          PW_VERSION: ${{ steps.playwright.outputs.version }}
        run: bunx playwright@$PW_VERSION install chromium --only-shell

      - name: Lint
        run: bun run lint --format junit --output-file ${ESLINT_JUNIT_OUTPUT_FILE}
      - name: Test
        run: bun run test
      - name: Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: success() || failure()
        with:
          check_name: Report
          include_passed: true
          report_paths: reports/*.junit.xml

  build:
    name: Build
    needs: test
    # `main` is served by netlify and builds itself, below
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build
        # the site is portable, only the workflow knows where it is served from
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}
          # the public ical feed of the association, a repository variable
          KVLM_CALENDAR_URL: ${{ vars.KVLM_CALENDAR_URL }}
        run: bun run --filter @kvlm/website build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/next'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - run: echo "Deployed ${{ steps.deployment.outputs.page_url }} :tada:" >> $GITHUB_STEP_SUMMARY

  netlify:
    name: Deploy to Netlify
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: netlify
      url: ${{ steps.deployment.outputs.url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        # netlify serves the site from the root of its own domain
        env:
          SITE: ${{ vars.NETLIFY_SITE_URL || 'https://www.kulturverein-lochmuehle.de' }}
          BASE: /
          KVLM_CALENDAR_URL: ${{ vars.KVLM_CALENDAR_URL }}
        run: bun run --filter @kvlm/website build
      - name: Deploy
        id: deployment
        # the cli only uploads what the step above built: `--no-build` keeps it
        # from looking for a framework to run, `--filter` tells it which of the
        # two packages is the site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          bunx netlify-cli@27 deploy \
            --prod \
            --no-build \
            --filter @kvlm/website \
            --dir "$GITHUB_WORKSPACE/packages/website/dist" \
            --message "${{ github.sha }}" \
            --json > deploy.json
          echo "url=$(jq -r '.url' deploy.json)" >> "$GITHUB_OUTPUT"
      - run: echo "Deployed ${{ steps.deployment.outputs.url }} :tada:" >> $GITHUB_STEP_SUMMARY
