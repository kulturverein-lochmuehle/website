name: Workflow
on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ESLINT_JUNIT_OUTPUT_FILE: reports/lint.junit.xml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Setup Node
        # the test runner and Astro still run on node, bun only installs and orchestrates
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Determine Playwright version
        id: playwright
        # bun's isolated linker keeps playwright out of the root node_modules
        run: echo "version=$(bun pm ls --all | awk '{print $NF}' | grep -E '^playwright@' | head -1 | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - name: Install Playwright browsers
        env:
          PW_VERSION: ${{ steps.playwright.outputs.version }}
        run: bunx playwright@$PW_VERSION install chromium --only-shell

      - name: Lint
        run: bun run lint --format junit --output-file ${ESLINT_JUNIT_OUTPUT_FILE}
      - name: Test
        run: bun run test
      - name: Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: success() || failure()
        with:
          check_name: Report
          include_passed: true
          report_paths: reports/*.junit.xml
