name: update dependencies

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday at 06:00 UTC
  workflow_dispatch: # also allow manual runs

# NOTE: this repo has no CI to validate the bumped branch, so the PR is opened
# without an automated check. Review the changes before merging.
jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the update branch
      pull-requests: write # open the PR
    steps:
      - uses: enke-dev/bumper@main
        with:
          skip: github-actions # GITHUB_TOKEN can't push .github/workflows/ changes
          pr-labels: dependencies
